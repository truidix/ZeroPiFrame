{% extends "base.html" %}
{% block title %} – {{ t('nav.sources') }}{% endblock %}

{% block content %}
<h1>{{ t('sources.heading') }}</h1>

<form method="POST">
  <div class="card">
    <div class="card-label">{{ t('common.active_source') }}</div>
    <div class="radio-group">
      <label class="radio-option">
        <input type="radio" name="source" value="nextcloud"
               {% if cfg.get('source','nextcloud') == 'nextcloud' %}checked{% endif %}>
        <span>{{ t('sources.nextcloud_option') }}</span>
      </label>
      <label class="radio-option">
        <input type="radio" name="source" value="immich"
               {% if cfg.get('source') == 'immich' %}checked{% endif %}>
        <span>{{ t('sources.immich_option') }}</span>
      </label>
    </div>
  </div>

  <!-- Nextcloud -->
  <div class="card mt source-panel" id="panel-nextcloud">
    <h2>{{ t('sources.nextcloud_heading') }}</h2>

    <label>{{ t('sources.nc_url_label') }}
      <input type="url" name="nc_url"
             value="{{ cfg.get('nextcloud', {}).get('url', '') }}"
             placeholder="{{ t('sources.nc_url_placeholder') }}">
    </label>

    <label>{{ t('sources.nc_user_label') }}
      <input type="text" name="nc_user"
             value="{{ cfg.get('nextcloud', {}).get('username', '') }}">
    </label>

    <label>{{ t('sources.password_label') }}
      <input type="password" name="nc_pass" placeholder="{{ t('sources.keep_unchanged_placeholder') }}">
    </label>

    <label>{{ t('sources.nc_folders_label') }}
      <textarea name="nc_folders" rows="3"
                placeholder="{{ t('sources.nc_folders_placeholder') }}">{{ (cfg.get('nextcloud', {}).get('folders', []) or []) | join('\n') }}</textarea>
    </label>

    <label class="checkbox-label">
      <input type="checkbox" name="nc_verify_ssl"
             {% if cfg.get('nextcloud', {}).get('verify_ssl', True) %}checked{% endif %}>
      {{ t('sources.nc_verify_ssl_label') }}
    </label>

    <label>{{ t('sources.min_resolution_label') }}
      <input type="number" name="nc_min_res" min="0" step="10"
             value="{{ cfg.get('nextcloud', {}).get('min_resolution_px', 0) }}">
      <small>{{ t('sources.nc_min_res_desc') }}</small>
    </label>

    <button type="button" class="btn btn-secondary mt-sm"
            onclick="testConnection('nextcloud')">{{ t('sources.test_connection_btn') }}</button>
    <div id="nc-result" class="test-result"></div>
  </div>

  <!-- Immich -->
  <div class="card mt source-panel" id="panel-immich">
    <h2>{{ t('sources.immich_heading') }}</h2>

    <label>{{ t('sources.im_url_label') }}
      <input type="url" name="im_url"
             value="{{ cfg.get('immich', {}).get('url', '') }}"
             placeholder="http://192.168.1.100:2283">
    </label>

    <label>{{ t('sources.im_api_key_label') }}
      <input type="password" name="im_key"
             placeholder="{{ t('sources.keep_unchanged_placeholder') }}">
      <small>{{ t('sources.im_api_key_hint') }}</small>
    </label>

    <label>{{ t('sources.im_albums_label') }}
      <textarea name="im_albums" rows="3"
                placeholder="{{ t('sources.im_albums_placeholder') }}">{{ (cfg.get('immich', {}).get('albums', []) or []) | join('\n') }}</textarea>
    </label>

    <label>{{ t('sources.min_resolution_label') }}
      <input type="number" name="im_min_res" min="0" step="10"
             value="{{ cfg.get('immich', {}).get('min_resolution_px', 0) }}">
      <small>{{ t('sources.im_min_res_desc') }}</small>
    </label>

    <button type="button" class="btn btn-secondary mt-sm"
            onclick="testConnection('immich')">{{ t('sources.test_connection_btn') }}</button>
    <div id="im-result" class="test-result"></div>
  </div>

  <div class="action-row mt">
    <button type="submit" class="btn btn-primary">{{ t('common.save_btn') }}</button>
  </div>
</form>
{% endblock %}

{% block scripts %}
<script>
const T = {
  testingConnection: {{ t('sources.testing_connection')|tojson }},
  networkError:      {{ t('sources.network_error')|tojson }},
};

// Highlight the panel matching the currently selected source
function updatePanels() {
  const val = document.querySelector('input[name="source"]:checked')?.value;
  document.querySelectorAll('.source-panel').forEach(p => {
    p.classList.toggle('panel-active', p.id === 'panel-' + val);
  });
}
document.querySelectorAll('input[name="source"]').forEach(r =>
  r.addEventListener('change', updatePanels));
updatePanels();

async function testConnection(type) {
  const resultEl = document.getElementById(type === 'nextcloud' ? 'nc-result' : 'im-result');
  resultEl.textContent = T.testingConnection;
  resultEl.className   = 'test-result';

  const payload = {type};
  if (type === 'nextcloud') {
    payload.url        = document.querySelector('[name="nc_url"]').value;
    payload.username   = document.querySelector('[name="nc_user"]').value;
    payload.password   = document.querySelector('[name="nc_pass"]').value;
    payload.verify_ssl = document.querySelector('[name="nc_verify_ssl"]').checked;
  } else {
    payload.url     = document.querySelector('[name="im_url"]').value;
    payload.api_key = document.querySelector('[name="im_key"]').value;
  }

  try {
    const r = await fetch('/api/test_connection', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const d = await r.json();
    resultEl.textContent = (d.ok ? '✓ ' : '✗ ') + d.message;
    resultEl.className   = 'test-result ' + (d.ok ? 'result-ok' : 'result-err');
  } catch(e) {
    resultEl.textContent = T.networkError;
    resultEl.className   = 'test-result result-err';
  }
}
</script>
{% endblock %}
